<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeWaze - Emergency-Aware Navigation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">
                <span class="material-icons">shield</span>
                SafeWaze
            </h1>
            <div class="status-indicators">
                <div class="alert-status" id="alertStatus">
                    <span class="material-icons">check_circle</span>
                    <span id="statusText">Safe</span>
                </div>
                <div class="api-status" id="apiStatus">
                    <span class="material-icons">wifi</span>
                    <span>Connected</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Alert Banner (Hidden by default) -->
        <div class="alert-banner" id="alertBanner" style="display: none;">
            <div class="alert-content">
                <span class="material-icons">warning</span>
                <div class="alert-text">
                    <h3>MISSILE ALERT</h3>
                    <p id="alertMessage">Alert in your area</p>
                </div>
                <div class="countdown-timer" id="countdownTimer">
                    <span id="countdownText">10:00</span>
                </div>
            </div>
        </div>

        <!-- Map Container -->
        <div class="map-container">
            <div id="map" class="map"></div>
            
            <!-- Map Controls -->
            <div class="map-controls">
                <button class="control-btn" id="locateBtn" title="My Location">
                    <span class="material-icons">my_location</span>
                </button>
                <button class="control-btn" id="shelterBtn" title="Find Shelters">
                    <span class="material-icons">home</span>
                </button>
                <button class="control-btn" id="settingsBtn" title="Settings">
                    <span class="material-icons">settings</span>
                </button>
            </div>
        </div>

        <!-- Emergency Panel -->
        <div class="emergency-panel" id="emergencyPanel">
            <h3>Emergency Services</h3>
            <div class="emergency-buttons">
                <button class="emergency-btn police" onclick="callEmergency('100')">
                    <span class="material-icons">local_police</span>
                    Police (100)
                </button>
                <button class="emergency-btn medical" onclick="callEmergency('101')">
                    <span class="material-icons">local_hospital</span>
                    MDA (101)
                </button>
                <button class="emergency-btn fire" onclick="callEmergency('102')">
                    <span class="material-icons">local_fire_department</span>
                    Fire (102)
                </button>
                <button class="emergency-btn pikud" onclick="callEmergency('104')">
                    <span class="material-icons">shield</span>
                    Pikud HaOref (104)
                </button>
            </div>
        </div>

        <!-- Shelter List (Hidden by default) -->
        <div class="shelter-panel" id="shelterPanel" style="display: none;">
            <h3>Nearby Shelters</h3>
            <div class="shelter-list" id="shelterList">
                <!-- Shelters will be populated dynamically -->
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="close-btn" id="closeSettings">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="voiceAlerts" checked>
                        Voice Alerts
                    </label>
                </div>
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="pushNotifications" checked>
                        Push Notifications
                    </label>
                </div>
                <div class="setting-group">
                    <label>
                        Language:
                        <select id="language">
                            <option value="en">English</option>
                            <option value="he">Hebrew</option>
                            <option value="ar">Arabic</option>
                            <option value="ru">Russian</option>
                        </select>
                    </label>
                </div>
                <div class="setting-group">
                    <label>
                        Alert Frequency:
                        <select id="alertFrequency">
                            <option value="10">Every 10 seconds</option>
                            <option value="30">Every 30 seconds</option>
                            <option value="60">Every minute</option>
                        </select>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Google Maps API with key - Load first -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD5h2wBcWp1bgL6jkj7L2leg-hERfjD7yI&libraries=geometry&callback=initSafeWaze" async defer></script>
    
    <!-- Scripts -->
    <script src="app.js"></script>
    <script>
        // Initialize app when Google Maps is ready
        function initSafeWaze() {
            try {
                console.log('🗺️ Google Maps API loaded, initializing SafeWaze...');
                SafeWaze.init();
            } catch (error) {
                console.error('SafeWaze initialization error:', error);
                // Fallback initialization
                setTimeout(() => {
                    try {
                        SafeWaze.init();
                    } catch (e) {
                        console.error('Fallback initialization failed:', e);
                    }
                }, 1000);
            }
        }
        
        // Fallback if Google Maps fails to load
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                if (!window.google || !window.SafeWaze) {
                    console.log('🔄 Loading SafeWaze without Google Maps...');
                    if (window.SafeWaze) {
                        SafeWaze.init();
                    }
                }
            }, 3000);
        });
    </script>
</body>
</html>
